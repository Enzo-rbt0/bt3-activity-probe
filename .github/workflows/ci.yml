name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Compila e testa PRs e a main. NUNCA publica: a publicação é só o pages.yml, depois do merge.
env:
  REQUIRE_EMCC: '1'

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Emscripten numa versão fixa (6.0.13, de 19/10/2026) para compilar wasm/emcc/probe.c.
      # Só a CI compila; o agente não tem o Emscripten instalado.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium para o teste de fumaça
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça (fora do Discord)
        run: npm run smoke
