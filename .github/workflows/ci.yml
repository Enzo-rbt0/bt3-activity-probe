name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Compila e testa PRs e a main. NUNCA publica: a publicação é só o pages.yml, depois do merge.
env:
  REQUIRE_EMCC: '1'

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Emscripten numa versão fixa (6.0.13, de 19/10/2026) para compilar wasm/emcc/probe.c.
      # Só a CI compila; o agente não tem o Emscripten instalado.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - name: Tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
      - name: Chromium para o teste de fumaça
        run: npx playwright install --with-deps chromium
      - name: Teste de fumaça (fora do Discord)
        run: npm run smoke

  # Servidor da F3 (só local: nenhum deploy, nenhuma credencial). Roda em x64 e em ARM64, a mesma
  # arquitetura da VM A1 da Oracle, na versão de Node do .nvmrc (22.x, a do Ubuntu da VM via NodeSource).
  servidor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/probe/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes (concorrência, orçamento, reinício, encerramento, SIGTERM)
        run: npm test
      - name: Scripts de operação (sintaxe)
        run: sh -n ops/bt3probe-janela && sh -n ops/bt3probe-limites

  # Testes de mutação do servidor: cada mutante altera um ponto crítico (limites, bilhete, janela,
  # reinício, validação do corpo, encerramento) e a suíte TEM de falhar. Falha o job se algum sobreviver.
  servidor-mutacao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/probe/package-lock.json
      - run: npm ci
      - name: Mutação (pontos críticos)
        run: npm run mutacao

  # Testa o criar-arquivo-teste.ps1 num Windows de verdade (PowerShell 5.1, o mesmo do usuário),
  # em pastas temporárias apagadas no fim. Não publica nada e não guarda o arquivo como artefato.
  script-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Script do arquivo de teste no Windows
        shell: powershell
        run: .\scripts\ci\testar-script-windows.ps1
