# Publica a sonda no GitHub Pages a cada merge na main (decisão do usuário, ADR-12).
# Aprovar o merge do PR = aprovar a publicação. Não há disparo manual.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REQUIRE_EMCC: '1'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Emscripten numa versão fixa (6.0.13, de 19/10/2026) para compilar wasm/emcc/probe.c.
      # Só a CI compila; o agente não tem o Emscripten instalado.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/probe/dist

  deploy:
    # Só a main publica (o gatilho já é push na main; esta linha é uma segunda trava).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
